<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Exercício 7 - Conversor de temperatura</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <button id="botao-voltar" class="botaoHome">⬅️ Voltar</button>
   
    <div class="container">
        <h1>Conversor de temperatura</h1>
        
        <label for="celsius">Temperatura em Celsius:</label>
        <input type="number" id="celsius" placeholder="Digite a temperatura...">
        
        <div class="botoes">
            <button onclick="converterFahreinheit()">Converter para Fahreinheit</button>
            <button onclick="converterKelvin()">Converter para Kelvin</button>
            <button onclick="limpar()">Limpar</button>
        </div>
        
        <p id="resultado">Resultado: </p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
