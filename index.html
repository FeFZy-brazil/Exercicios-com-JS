<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio - Exercícios Em JavaScript</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #1a73e8;
            font-weight: 800;
        }
        .container-pastas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 40px auto;
        }
        .pasta-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        .pasta-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .pasta-card i {
            font-size: 50px;
            color: #ffe082;
            margin-bottom: 12px;
        }
        .pasta-card span {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <h1>📁 Meu Universo de Projetos</h1>

    <div class="container-pastas" id="gradeDePastas"></div>

    <script>
        const minhasPastas = [
            "Exercício 001",
            "Exercício 002",
            "Exercício 003",
            "Exercício 004",
            "Exercício 005",
            "Exercício 006",
            "Exercício 007",
            "Exercício 008",
            "Exercício 009",
            "Exercício 010",
            "Exercício 011",
            "Exercício 012",
            "Exercício 013",
            "Exercício 014",
            "Exercício 015",
            "Exercício 016",
            "Exercício 017",
            "Exercício 018",
            "Exercício 019",
            "Exercício 020"
        ];

        const container = document.getElementById('gradeDePastas');

        minhasPastas.forEach(nomeDaPasta => {
            
            const link = document.createElement('a');
            link.className = 'pasta-card';
            
            link.href = `./${nomeDaPasta}/index.html`;

            const icone = document.createElement('i');
            icone.className = 'fa-solid fa-folder';

            const texto = document.createElement('span');
            texto.innerText = nomeDaPasta.replace(/-/g, ' '); 

            link.appendChild(icone);
            link.appendChild(texto);

            container.appendChild(link);
        });
    </script>
</body>
